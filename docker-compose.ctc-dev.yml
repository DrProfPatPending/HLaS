name: ctc-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctc_dev
      POSTGRES_DB: ctc_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctc_dev -d ctc_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: hlas-ctc-dev-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HLAS_DATA_DIR: /data
      HLAS_CLUBS_CONFIG_PATH: /config/clubs.config.json
      HLAS_USE_POSTGRES_READS: "true"
      HLAS_USE_POSTGRES_WRITES: "true"
      HLAS_SYNC_FILES_ON_STARTUP: "false"
      ENABLE_BACKUPS: "false"
      HLAS_MEMBER_TOKEN_TTL_SECONDS: "300"
      HLAS_MEMBER_REFRESH_TOKEN_TTL_SECONDS: "600"
    secrets:
      - postgres_password
    command:
      - sh
      - -ec
      - |
        password=$$(cat /run/secrets/postgres_password)
        export DATABASE_URL="postgresql+psycopg://ctc_dev:$${password}@postgres:5432/ctc_dev"
        alembic upgrade head
        exec gunicorn -w 2 --threads 4 -b 0.0.0.0:5050 --log-level info app:app
    volumes:
      - app_data:/data
      - ./deploy/clubs.config.ctc-dev.json:/config/clubs.config.json:ro
    networks:
      app:
        aliases:
          - ctc-dev-backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/clubs', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  frontend:
    image: hlas-ctc-dev-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_BACKEND_URL: /api
    networks:
      app:
        aliases:
          - ctc-dev-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile.ctc-dev:/etc/caddy/Caddyfile:ro
      - dev_tls:/data
      - caddy_config:/config
    networks:
      - app
      - legacy
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./deploy/.ctc-dev-postgres-password

volumes:
  postgres_data:
  app_data:
  caddy_config:
  dev_tls:
    external: true
    name: hlas_caddy_data

networks:
  app:
    internal: true
  legacy:
    external: true
    name: hlas_default
