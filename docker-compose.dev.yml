# Docker Compose override for the hlastest dev server.
# Configures the dev server to use deploy/caddy/Caddyfile.dev (hlastest + tls internal)
# instead of the production Caddyfile (cambridgetroutclub.org + Let's Encrypt).
#
# After starting, run trust_caddy_mac.sh on your Mac once to install the
# Caddy root CA into the macOS System Keychain.

services:
  caddy:
    volumes:
      - ./deploy/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro

  wordpress:
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://wordpress.hlastest');
        define('WP_SITEURL', 'https://wordpress.hlastest');
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO'])) {
          $$_SERVER['HTTPS'] = $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ? 'on' : 'off';
        } elseif (strpos($$_SERVER['HTTP_HOST'] ?? '', 'wordpress.hlastest') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
        if (!empty($$_SERVER['HTTP_X_FORWARDED_FOR'])) {
          $$_SERVER['REMOTE_ADDR'] = explode(',', $$_SERVER['HTTP_X_FORWARDED_FOR'])[0];
        }
