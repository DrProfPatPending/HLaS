server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        try_files /admin.html =404;
    }

    location /api/ {
        proxy_pass http://backend:5050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:5050/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Mini-site pages: backend serves the SPA shell with per-club SEO tags injected.
    location ~ ^/club/[^/]+(/[a-z0-9-]+)?/?$ {
        rewrite ^/club/([^/]+)(?:/([a-z0-9-]+))?/?$ /club-page/$1/$2 break;
        proxy_pass http://backend:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        error_page 502 503 504 = @spa_fallback;
    }

    location @spa_fallback {
        try_files /index.html =503;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
