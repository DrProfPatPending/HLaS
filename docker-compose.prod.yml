name: hlas

services:
  postgres:
    env_file:
      - .env.prod
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  backend:
    env_file:
      - .env.prod
    image: ${BACKEND_IMAGE}
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HLAS_DATA_DIR: /data
      HLAS_MEMBER_TOKEN_TTL_SECONDS: "300"
      HLAS_MEMBER_REFRESH_TOKEN_TTL_SECONDS: "600"
    volumes:
      - hlas_data:/data
      - ./backend/club_logos:/app/club_logos
    restart: unless-stopped
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/clubs', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VUE_APP_BACKEND_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  caddy:
    env_file:
      - .env.prod
    image: caddy:2.8-alpine
    depends_on:
      frontend:
        condition: service_healthy
      wordpress-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  wordpress-db:
    env_file:
      - .env.prod
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    env_file:
      - .env.prod
    image: wordpress:6.9-php8.3-fpm-alpine
    container_name: hlas-wordpress
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://wordpress.cambridgetroutclub.org');
        define('WP_SITEURL', 'https://wordpress.cambridgetroutclub.org');
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO'])) {
          $$_SERVER['HTTPS'] = $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ? 'on' : 'off';
        } elseif (strpos($$_SERVER['HTTP_HOST'] ?? '', 'wordpress.cambridgetroutclub.org') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
        if (!empty($$_SERVER['HTTP_X_FORWARDED_FOR'])) {
          $$_SERVER['REMOTE_ADDR'] = explode(',', $$_SERVER['HTTP_X_FORWARDED_FOR'])[0];
        }
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-plugin/hlas-integration:/var/www/html/wp-content/plugins/hlas-integration
    restart: unless-stopped

  wordpress-web:
    image: nginx:alpine
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-plugin/hlas-integration:/var/www/html/wp-content/plugins/hlas-integration:ro
      - ./deploy/nginx/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    external: true
    name: hlas_postgres_data
  hlas_data:
  caddy_data:
  caddy_config:
  wordpress_data:
  wordpress_db_data:
