name: hlas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hlas}
      POSTGRES_DB: ${POSTGRES_DB:-hlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  backend:
    image: ${BACKEND_IMAGE}
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HLAS_DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HLAS_USE_POSTGRES_READS: ${HLAS_USE_POSTGRES_READS:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      GAAFFS_SMTP_PASSWORD: ${GAAFFS_SMTP_PASSWORD}
    volumes:
      - hlas_data:/data
      - ./backend/club_logos:/app/club_logos
    restart: unless-stopped
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/clubs', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VUE_APP_BACKEND_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  hlas_data:
  caddy_data:
  caddy_config:
