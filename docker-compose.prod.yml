name: hlas

services:
  backend:
    image: ${BACKEND_IMAGE}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HLAS_DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - hlas_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/clubs', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VUE_APP_BACKEND_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  hlas_data:
  caddy_data:
  caddy_config:
